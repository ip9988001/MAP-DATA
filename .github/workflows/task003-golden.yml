name: task003-golden-coalesce

# TASK-003 生产流水线：Dover, DE 四源全量 → 24 字段黄金地址库
# 铁律：
#   1) 所有原始数据下载都发生在 GitHub Actions runner（本机服务器零下载）
#   2) 只动测试仓 world-map-data-test；不碰生产仓 MAP-DATA
#   3) 全部产出由本 workflow 自动生成 + 自动提交 + 自动交卷（无逐条手工编辑数据）
#
# 交卷方式：① 提交产物到 main；② POST 全文到中继站 https://gempi.gtop.dev/api/messages
#           （author=PI-Agent → worker 自动发信给 Gemini）；中继站失败时用 Resend 兜底直投。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 原始数据 Release tag
        default: dover-raw-20261015-0450
      post_relay:
        description: 是否把交卷全文 POST 到中继站（true/false）
        default: "true"
      commit_outputs:
        description: 是否把产物提交回 main（true/false）
        default: "true"

permissions:
  contents: write

concurrency:
  group: task003-golden-coalesce
  cancel-in-progress: false

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装依赖（pyshp 纯 pip；不装 GDAL）
        run: pip install "pyshp>=2.3.1"

      - name: runner 侧下载 Release 全量原始资产（本机零下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data/dover/task003/raw
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" \
            -D data/dover/task003/raw --clobber
          ls -la data/dover/task003/raw
          du -sh data/dover/task003/raw

      - name: 运行四源全量自动化 ETL（scripts/dover_golden_coalesce.py）
        run: |
          python scripts/dover_golden_coalesce.py \
            --input-dir data/dover/task003/raw \
            --out-dir   data/dover/task003 \
            --docs-dir  docs

      - name: 结果摘要（供人工复核）
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/dover/task003/dover_funnel.json")
          if p.exists():
              f = json.loads(p.read_text(encoding="utf-8"))
              print("== 漏斗 ==")
              for k in ("nad_raw_rows","overture_raw_features","tiger_addrfeat_raw_rows",
                        "s_tier_kept","a_tier_kept","golden_total",
                        "oa_b_tier_orphan_dropped","overture_b_tier_orphan_dropped"):
                  print(f"  {k} = {f.get(k)}")
              print("== 分布 ==")
              print(json.dumps(f.get("distributions"), ensure_ascii=False)[:1200])
          else:
              print("漏斗未生成")
          PY
          ls -la data/dover/task003

      - name: 提交产物到 main
        if: ${{ always() && inputs.commit_outputs != 'false' }}
        run: |
          git config user.name  "pi-agent-bot"
          git config user.email "pi-agent@users.noreply.github.com"
          for f in data/dover/task003/dover_golden_addresses.jsonl \
                   data/dover/task003/dover_golden_addresses.csv \
                   data/dover/task003/golden_sample_50.csv \
                   data/dover/task003/golden_fillrate_24fields.csv \
                   data/dover/task003/dover_funnel.json \
                   data/dover/task003/dover_task003_summary.json \
                   data/dover/task003/five_address_4source_comparisons.json \
                   docs/task003_report.md docs/task003_email_body.txt ; do
            if [ -f "$f" ]; then git add "$f"; else echo "⚠️ 缺失产物: $f"; fi
          done
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "feat(task003): Dover 四源全量 ETL → 24 字段黄金地址库 + 漏斗/填充率/50 样本/5 例对照 [run ${{ github.run_id }}]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi

      - name: 交卷 · POST 全文到中继站（author=PI-Agent → worker 自动发信）
        id: relay
        if: ${{ inputs.post_relay != 'false' }}
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request
          body = pathlib.Path("docs/task003_email_body.txt").read_text(encoding="utf-8")
          payload = json.dumps({"author": "PI-Agent", "content": body}, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              "https://gempi.gtop.dev/api/messages", data=payload,
              headers={"Content-Type": "application/json; charset=utf-8",
                       "User-Agent": "Mozilla/5.0 (compatible; pi-task003-bot/1.0)"})
          with urllib.request.urlopen(req, timeout=90) as resp:
              print("relay status:", resp.status, resp.read()[:400].decode("utf-8", "replace"))
          PY

      - name: 交卷 · 中继站失败时 Resend 兜底直投
        if: ${{ inputs.post_relay != 'false' && steps.relay.outcome == 'failure' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          key = os.environ.get("RESEND_API_KEY") or ""
          if not key:
              print("未配置 RESEND_API_KEY → 跳过兜底直投（中继站失败请人工复核）")
              raise SystemExit(0)
          body = pathlib.Path("docs/task003_email_body.txt").read_text(encoding="utf-8")
          payload = json.dumps({
              "from": "bridge@gtop.dev",
              "to": ["miaoxinxin9701@gmail.com"],
              "subject": "[PI-BRIDGE · 二号方案] TASK-003 交卷全文 · 直接看本邮件，勿去中继站",
              "text": body,
          }, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request("https://api.resend.com/emails", data=payload, headers={
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json; charset=utf-8",
              "User-Agent": "pi-bridge/1.0 (+https://gempi.gtop.dev)"})
          with urllib.request.urlopen(req, timeout=90) as resp:
              print("resend status:", resp.status, resp.read()[:300].decode("utf-8", "replace"))
          PY

      - name: 上传产物体（全量 jsonl/csv 便于外部取用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dover-task003-golden-${{ github.run_id }}
          path: |
            data/dover/task003/*.jsonl
            data/dover/task003/*.csv
            data/dover/task003/*.json
            docs/task003_report.md
            docs/task003_email_body.txt
          retention-days: 30
