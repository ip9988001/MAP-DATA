name: task001-dover-19901

# TASK-001 一次性交付：Dover DE 19901 四源各 20 条样本 + 全字段非空填充率
# 只读仓库里已有的原始产物（外加 NAD 官方 REST 现拉），不引入新数据源。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task001-dover-19901
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 装依赖
        run: pip install -r requirements.txt

      - name: 生成 TASK-001 交付
        run: python bots/task001_report.py

      - name: 展示要点
        run: |
          echo "=== 产物 ==="
          find data/dover/task001 -type f -printf '%10s  %p\n' | sort -k2
          echo "=== 交付正文头 40 行 ==="
          head -40 data/dover/task001/relay_post.md

      - name: 提交产物回 main
        run: |
          git config user.name  "dover-bot"
          git config user.email "dover-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "task001: Dover DE 19901 四源各 20 条样本 + 全字段填充率 [run ${{ github.run_id }}]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task001-dover-19901-${{ github.run_id }}
          path: |
            data/dover/task001
            docs/task001_report.md
          retention-days: 30
