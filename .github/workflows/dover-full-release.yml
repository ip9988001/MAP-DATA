name: dover-full-release

# 四源 Dover 全量【原始】数据 → 直接发 GitHub Releases（不做清洗/去重/合并）
# 所有下载都在 runner 上跑，本地服务器零下载。
# 注意：本工作流**不往 git 提交任何大文件**，产物只作为 Release 资产。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag（留空 = dover-raw-<UTC时间戳>）
        default: ""
      nad_max:
        description: NAD 最大分页行数（够大就行，200000 = 全量）
        default: "200000"

permissions:
  contents: write

concurrency:
  group: dover-full-release
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 装依赖（overturemaps CLI + pyshp）
        run: pip install -r requirements.txt

      - name: 四源全量抓取 + 建 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          DOVER_NAD_MAX: ${{ inputs.nad_max || '200000' }}
        run: python bots/dover_full_dump.py

      - name: 结果摘要
        if: always()
        run: |
          find data/dover/full -type f -printf '%10s  %p\n' | sort -k2 | head -40
          echo "--- MANIFEST 摘要 ---"
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/dover/full/MANIFEST.json")
          if p.exists():
              m = json.loads(p.read_text())
              for a in m["assets"]:
                  print(f"{a['bytes']:>12,}  {a['path']}  {a.get('rows','')}")
              print(json.dumps([{k: v for k, v in s.items() if k != 'detail'} for s in m["sources"]], ensure_ascii=False)[:1500])
          else:
              print("MANIFEST 未生成")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dover-full-raw-${{ github.run_id }}
          path: data/dover/full
          retention-days: 14
