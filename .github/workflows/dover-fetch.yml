name: dover-fetch

# 第一个 py 机器人工作流：把 Dover, DE 从四个数据源「切片」拉下来并落库。
# 所有下载都发生在 GitHub 的 runner 上，本地服务器零下载。

on:
  workflow_dispatch:
    inputs:
      state:
        description: 州简称
        default: DE
      city:
        description: 城市名
        default: Dover
      zip:
        description: 主邮编
        default: "19901"
      bbox:
        description: 包围盒 W,S,E,N
        default: "-75.60,39.10,-75.45,39.22"
  schedule:
    - cron: "0 6 * * *"        # 每天 06:00 UTC 自动跑一轮（探针式，故意不频繁）

permissions:
  contents: write              # 产物要提交回 main

concurrency:
  group: dover-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 装依赖（overturemaps CLI + pyshp）
        run: pip install -r requirements.txt

      - name: 跑四源取样机器人
        env:
          DOVER_STATE: ${{ inputs.state || 'DE' }}
          DOVER_CITY: ${{ inputs.city || 'Dover' }}
          DOVER_ZIP: ${{ inputs.zip || '19901' }}
          DOVER_BBOX: ${{ inputs.bbox || '-75.60,39.10,-75.45,39.22' }}
        run: python bots/dover_fetch.py

      - name: 展示产物
        run: |
          find data/dover -type f -printf '%10s  %p\n' | sort -k2 | head -40
          echo "--- align 前 5 行 ---"
          head -5 data/dover/align_19901_main_state.csv || true

      - name: 提交产物回 main
        run: |
          git config user.name  "dover-bot"
          git config user.email "dover-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "本轮无变化，不提交"
          else
            git commit -m "bot(dover): 四源取样 $(date -u +%Y-%m-%dT%H:%MZ) [run ${{ github.run_id }}]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dover-samples-${{ github.run_id }}
          path: data/dover
          retention-days: 30
